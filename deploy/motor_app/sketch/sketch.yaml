profiles:
  default:
    platforms:
      - platform: arduino:zephyr
    libraries:
      # Servo.h is NOT bundled with the arduino:zephyr core — without this
      # entry, SERVO_ENABLED=1 fails to compile with "Servo.h: No such file or
      # directory". 1.3.0 lists zephyr among its supported architectures.
      - Servo (1.3.0)
default_profile: default
